<!DOCTYPE html>

<html>


<head>

    <meta charset="UTF-8">

    <link rel="stylesheet"
          href="/css/style.css">

    <title>
        修改密码
    </title>

</head>


<body>


<div class="card">


    <h2 class="title">
        修改密码
    </h2>



    <input
            class="input"
            id="oldPassword"
            type="password"
            placeholder="旧密码">



    <input
            class="input"
            id="newPassword"
            type="password"
            placeholder="新密码">



    <button
            class="btn"
            onclick="changePassword()">

        保存

    </button>


    <p id="msg"></p>


</div>



<script>


    function changePassword(){


        fetch(
            "/auth/password",
            {

                method:"PUT",

                headers:{

                    "Content-Type":
                        "application/json",


                    "Authorization":

                        "Bearer "

                        +

                        localStorage.getItem(
                            "token"
                        )

                },


                body:JSON.stringify({

                    oldPassword:
                    oldPassword.value,


                    newPassword:
                    newPassword.value

                })

            }

        )

            .then(
                r=>r.json()
            )

            .then(data=>{


                msg.innerText =
                    data.message ||
                    "修改成功";


            });


    }


</script>


</body>

</html>
